<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e4a22">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Outreach Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/lexend.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" aria-live="polite"><div class="boot"><img src="img/logo-256.png" alt="" width="88" height="88"><div class="spinner"></div></div></div>
<div id="toast" role="status"></div>
<noscript><p style="padding:24px">Outreach Tracker needs JavaScript turned on.</p></noscript>
<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/sync.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/app.js"></script>
<script>
  // Keep the app's files on the phone. Show "Update" when a new version has arrived.
  // Remember Android's "install" offer so the app can show its own Install button.
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      function offer(w) {
        if (!w || document.querySelector('.update-bar')) return;
        var bar = document.createElement('div'); bar.className = 'update-bar';
        bar.innerHTML = '<span>A new version of the app is ready.</span><button class="btn leaf mini" type="button">Update now</button>';
        bar.querySelector('button').onclick = function () { w.postMessage('update-now'); };
        document.body.appendChild(bar);
      }
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
      });
    });
    // Reload only when a new version replaces an old one, never on the very first visit.
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController) { hadController = true; return; }
      if (!reloaded) { reloaded = true; location.reload(); }
    });
  }
</script>
</body>
</html>
